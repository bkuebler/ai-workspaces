name: yamllint

on:
  push:
    paths:
      - "**.yml"
      - "**.yaml"
      - ".yamllint.yaml"
      - "Makefile"
  pull_request:
    paths:
      - "**.yml"
      - "**.yaml"
      - ".yamllint.yaml"
      - "Makefile"

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - run: make lint-yaml
