name: shellcheck

on:
  push:
    paths:
      - "template/bootstrap.sh"
      - ".shellcheckrc"
      - "Makefile"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "template/bootstrap.sh"
      - ".shellcheckrc"
      - "Makefile"
      - ".github/workflows/shellcheck.yml"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lint-shell
