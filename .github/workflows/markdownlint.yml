name: markdownlint

on:
  push:
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - "Makefile"
  pull_request:
    paths:
      - "**.md"
      - ".markdownlint.yaml"
      - "Makefile"

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lint-markdown
