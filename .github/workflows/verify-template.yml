name: verify-template

on:
  push:
    paths:
      - "copier.yml"
      - "template/**"
      - "Makefile"
      - ".github/workflows/verify-template.yml"
  pull_request:
    paths:
      - "copier.yml"
      - "template/**"
      - "Makefile"
      - ".github/workflows/verify-template.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: make verify-template
