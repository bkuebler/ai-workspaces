_subdirectory: template
_min_copier_version: "9.0.0"

org:
  type: str
  help: GitHub organization
  validator: "{% if not org %}Please provide an organization{% endif %}"

clone_protocol:
  type: str
  help: Clone protocol
  choices: [ssh, https]
  default: ssh

topic:
  type: str
  help: Only repos with this GitHub topic (empty = all)
  default: ""

exclude:
  type: str
  help: Repos to exclude, separated by spaces
  default: ".github workspace-template"

skip_archived:
  type: bool
  help: Skip archived repos?
  default: true

skip_forks:
  type: bool
  help: Skip forks?
  default: true

update_mode:
  type: str
  help: Behavior for repos that already exist
  choices: [fetch, pull]
  default: fetch
